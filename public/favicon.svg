<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#090d0b" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Circuit Nodes -->
  <circle cx="16" cy="18" r="2" fill="#22c55e" />
  <circle cx="48" cy="18" r="2" fill="#22c55e" />
  <circle cx="16" cy="46" r="2" fill="#22c55e" />
  <circle cx="48" cy="46" r="2" fill="#22c55e" />

  <!-- Matrix 'M' + SIM Chip Core -->
  <path d="M 16 46 L 16 18 L 32 34 L 48 18 L 48 46" fill="none" stroke="url(#matrixGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Digital Pulse Dot -->
  <circle cx="32" cy="34" r="3" fill="#4ade80" />
</svg>
